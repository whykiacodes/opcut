<svg width="692" height="474" viewBox="0 0 692 474" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Option-Tab switcher: the open apps list, most recent first, with the selection stepping down on each Tab">
  <style>
    .cursor { animation: cycle 5.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .tab { animation: tap 5.2s linear infinite; }
    @keyframes cycle {
      0%, 24% { transform: translateY(0); }
      27%, 49% { transform: translateY(52px); }
      52%, 74% { transform: translateY(104px); }
      77%, 100% { transform: translateY(0); }
    }
    @keyframes tap {
      0%, 23%, 29%, 48%, 54%, 100% { fill-opacity: 0.06; }
      25%, 27%, 50%, 52% { fill-opacity: 0.22; }
    }
    @media (prefers-reduced-motion: reduce) { .cursor, .tab { animation: none; } }
    </style>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#2b2b34"/>
      <stop offset="0.38" stop-color="#1f1f26"/>
      <stop offset="1" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="popover" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#34343b"/>
      <stop offset="0.35" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#3e4c60"/>
      <stop offset="0.6" stop-color="#354459"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="float" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/></symbol><symbol id="i-dots" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="i-slash" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5L7 19"/></symbol><symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></symbol><symbol id="i-bang" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v.01"/><path d="M12 15V5"/></symbol><symbol id="i-option" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h5l6 12h5"/><path d="M14 6h6"/></symbol><symbol id="i-enter" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6v6a3 3 0 0 1-3 3H5l4-4m0 8l-4-4"/></symbol><symbol id="i-shift" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20v-8H5.414a1 1 0 0 1-.707-1.707l6.586-6.586a1 1 0 0 1 1.414 0l6.586 6.586A1 1 0 0 1 18.586 12H15v8a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/></symbol><symbol id="i-backspace" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5-5a1.5 1.5 0 0 1 0-2l5-5z"/><path d="M12 10l4 4m0-4l-4 4"/></symbol><symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l3 3l-3 3"/><path d="M13 15h3"/><rect x="3" y="4" width="18" height="16" rx="2"/></symbol>
    
  </defs>
  <g transform="translate(40 24)">
    <rect width="612" height="370" rx="20" fill="url(#glass)" filter="url(#lift)"/><rect x="0.5" y="0.5" width="611" height="369" rx="19.5" stroke="#fff" stroke-opacity="0.15"/><path d="M20 1.5H592" stroke="#fff" stroke-opacity="0.12"/><rect x="21" y="17" width="26" height="26" rx="7" fill="#354459" fill-opacity="1"/><rect x="21.5" y="17.5" width="25" height="25" rx="6.5" stroke="#fff" stroke-opacity="0.15"/><use href="#i-slash" x="25" y="21" width="18" height="18" stroke="#f5f7fb" stroke-width="2"/><text x="60" y="37" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#9b9ba5" text-anchor="start" letter-spacing="-0.25">to search open apps</text><circle cx="582" cy="30" r="15" fill="#ffffff" fill-opacity="0.055"/><circle cx="582" cy="30" r="14.5" stroke="#fff" stroke-opacity="0.15"/><use href="#i-dots" x="574" y="22" width="16" height="16" stroke="#b5b5bd" stroke-width="2"/><path d="M20 60.5H592" stroke="#fff" stroke-opacity="0.08"/><g class="cursor"><rect x="8" y="121" width="596" height="50" rx="8" fill="url(#sel)"/><rect x="8.5" y="121.5" width="595" height="49" rx="7.5" stroke="#b9d2f5" stroke-opacity="0.1"/><use href="#i-enter" x="466.0" y="140" width="12" height="12" stroke="#c0cfe3" stroke-width="2"/><text x="514" y="150" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#c0cfe3" text-anchor="end">Focus</text><rect x="526" y="134" width="66" height="24" rx="12" fill="#fff" fill-opacity="0.08"/><rect x="526.5" y="134.5" width="65" height="23" rx="11.5" stroke="#fff" stroke-opacity="0.15"/><use href="#i-shift" x="536" y="140" width="12" height="12" stroke="#f5f7fb" stroke-width="2"/><use href="#i-backspace" x="549" y="140" width="12" height="12" stroke="#f5f7fb" stroke-width="2"/><text x="566" y="150" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#f5f7fb" text-anchor="start">Quit</text></g><rect x="21" y="81" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.06"/><text x="34" y="98.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#b5b5bd" text-anchor="middle">G</text><text x="60" y="99" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#f2f2f5" text-anchor="start" letter-spacing="-0.2">Ghostty</text><rect x="21" y="133" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.06"/><text x="34" y="150.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#b5b5bd" text-anchor="middle">S</text><text x="60" y="151" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#f2f2f5" text-anchor="start" letter-spacing="-0.2">Safari</text><rect x="21" y="185" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.06"/><text x="34" y="202.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#b5b5bd" text-anchor="middle">F</text><text x="60" y="203" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#f2f2f5" text-anchor="start" letter-spacing="-0.2">Figma</text><rect x="21" y="237" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.06"/><text x="34" y="254.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#b5b5bd" text-anchor="middle">M</text><text x="60" y="255" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#f2f2f5" text-anchor="start" letter-spacing="-0.2">Mail</text><rect x="21" y="289" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.06"/><text x="34" y="306.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#b5b5bd" text-anchor="middle">N</text><text x="60" y="307" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#f2f2f5" text-anchor="start" letter-spacing="-0.2">Notes</text><path d="M0 336.5H612" stroke="#fff" stroke-opacity="0.08"/><text x="20" y="357" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#b5b5bd" text-anchor="start">Open apps</text><text x="592" y="357" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9b9ba5" text-anchor="end">5 results</text><rect x="216" y="404" width="44" height="30" rx="7" fill="#8a8a96" fill-opacity="0.22" stroke="#8a8a96" stroke-opacity="0.6"/><text x="238" y="424" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8a8a96" text-anchor="middle">&#8997;</text><text x="272" y="424" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#8a8a96" text-anchor="start">held</text><rect class="tab" x="314" y="404" width="58" height="30" rx="7" fill="#8a8a96" fill-opacity="0.06" stroke="#8a8a96" stroke-opacity="0.6"/><text x="343" y="424" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#8a8a96" text-anchor="middle">tab</text><text x="384" y="424" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#8a8a96" text-anchor="start">tap to cycle</text>
  </g>
</svg>
