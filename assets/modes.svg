<svg width="692" height="398" viewBox="0 0 692 398" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="opcut panel showing quick slots, with the modes menu open: Open apps, Commands, Shell, Quick slots">
  
