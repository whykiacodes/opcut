or="start">Shell folder, icons, gestures</text><rect x="349" y="165" width="26" height="26" rx="7" fill="#fff" fill-opacity="0.06"/><use href="#i-bang" x="354.5" y="170.5" width="15" height="15" stroke="#b5b5bd" stroke-width="2"/><text x="385" y="175" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#f2f2f5" text-anchor="start">Shell</text><text x="385" y="190" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#b5b5bd" text-anchor="start">Run a command in Terminal</text><rect x="349" y="211" width="26" height="26" rx="7" fill="#fff" fill-opacity="0.06"/><use href="#i-option" x="354.5" y="216.5" width="15" height="15" stroke="#b5b5bd" stroke-width="2"/><text x="385" y="221" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#f2f2f5" text-anchor="start">Quick slots</text><text x="385" y="236" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#b5b5bd" text-anchor="start">Pin apps to Option and a number</text>
